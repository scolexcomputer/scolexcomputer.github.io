<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tutorials - Scolex Computer Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/video.css">
</head>
<body>

<div class="container">
    <div class="card">

        <div class="header-banner">
            <h1>Scolex Computer Classes</h1>
            <h2>IACT (Institute for Advanced Computer Technology)</h2>
            <p class="location-text">📍 Shanti Market, Main Road, Motipur</p>
        </div>

        <div class="top-nav">
            <a href="index.html" class="back-home">⬅ Back to Home</a>
            <!-- Logout only visible for Admin (controlled by JS) -->
            <button type="button" class="logout-btn" id="logoutBtn" onclick="doLogout()">🚪 Logout</button>
        </div>

        <div class="page-title">
            <div>🎬 Video Tutorials <span id="videoCount">(0)</span></div>
            <div id="adminControls" style="display:none;">
                <button type="button" class="admin-btn" onclick="toggleAdminPanel()">+ Add Video</button>
            </div>
        </div>

        <div class="topic-tabs" id="topicTabs"></div>

        <div class="admin-panel" id="adminPanel">
            <h4>👤 Admin – Add YouTube Video</h4>
            <div class="admin-form">
                <div class="full">
                    <label>YouTube Link or Video ID *</label>
                    <input type="text" id="ytLink" placeholder="https://www.youtube.com/watch?v=xxxxx  or  just video ID">
                </div>
                <div>
                    <label>Title *</label>
                    <input type="text" id="ytTitle" placeholder="Video title">
                </div>
                <div>
                    <label>Topic / Section *</label>
                    <select id="ytTopic">
                        <option value="Fundamental">Fundamental</option>
                        <option value="Windows">Windows</option>
                        <option value="Microsoft Word">Microsoft Word</option>
                        <option value="Microsoft Excel">Microsoft Excel</option>
                        <option value="Microsoft Powerpoint">Microsoft Powerpoint</option>
                        <option value="Internet & E-mail">Internet & E-mail</option>
                    </select>
                </div>
                <div>
                    <label>Start Time (seconds, optional)</label>
                    <input type="number" id="ytStart" placeholder="0" min="0" value="0">
                </div>
                <div class="full">
                    <label>Description</label>
                    <textarea id="ytDesc" rows="2" placeholder="Short description of the video"></textarea>
                </div>
                <div class="actions">
                    <button type="button" class="admin-btn success" onclick="addVideo()">Save Video</button>
                    <button type="button" class="admin-btn danger" onclick="toggleAdminPanel()">Cancel</button>
                </div>
            </div>
        </div>

        <div id="sectionsContainer"></div>

    </div>
</div>

<script src="js/video.js"></script>
<script src="js/session.js"></script>

</body>
</html>
