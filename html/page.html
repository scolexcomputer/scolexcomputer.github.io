<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Form</title>

 <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container py-5">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <div class="text-center">

            <div class="heading-box">

                 <img src="logo.png" class="logo" alt="Logo">

                    <div class="heading-text">
                        <h1>Scolex Computer Classes</h1>
                        <h2>A Unit of IACT (Institute of Advanced Computer Technology)</h2>
                        <h3>Admission Form</h3>
                    </div>

                 <img src="logo.png" class="logo" alt="Logo">

            </div>

<form id="applicationForm">

<!-- Personal Information -->

    <h5 class="section-title">
    <i class="bi bi-person-circle"></i>Personal Information</h5>

<div class="row">

    <div class="col-md-4 mb-3">

        <label>Full Name</label>

            <input
            type="text"
            class="form-control"
            placeholder="Enter Your Full Name"
            name="fullname"
            required>

    </div>

    <div class="col-md-4 mb-3">

        <label>Father's Name</label>

            <input
            type="text"
            class="form-control"
            placeholder="Enter Your Father's Name"
            name="fathername"
            required>

    </div>

    <div class="col-md-4 mb-3">

            <label>Mobile Number</label>

                <input
                type="tel"
                class="form-control"
                placeholder="Enter your Mobile number"
                name="mobile"
                required>

    </div>

    <div class="col-md-4 mb-3">

        <label>Email Address</label>

            <input
            type="email"
            class="form-control"
            placeholder="Enter Your Email Address"
            name="email"
            required>

    </div>
    <div class="col-md-4 mb-3">

        <label>Date of Birth</label>

        <input
        type="date"
        class="form-control"
        name="dob"
        value="2000-01-01"
        min="1900-01-01"
        max="2012-08-09"
        onfocus="this.showPicker()">

    </div>

    <div class="col-md-4 mb-3">

        <label>Gender</label>

        <select
        class="form-select"
        name="gender">

        <option value="">Select Gender</option>

        <option>Male</option>

        <option>Female</option>

        <option>Other</option>

        </select>

    </div>


</div>

<!-- Educational Details -->

    <h5 class="section-title">
    <i class="bi bi-card-list"></i>Educational Details</h5>

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Education
        </label>

        <select
            class="form-select"
            name="education">

            <option value="">Select Education</option>

            <option>10th</option>

            <option>12th</option>

            <option>Graduate</option>

            <option>Post Graduate</option>

            <option>Diploma</option>

            <option>ITI</option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            School / College Name
        </label>

        <input
            type="text"
            class="form-control"
            name="college"
            placeholder="Enter School / College Name">

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Board / University
        </label>

        <input
            type="text"
            class="form-control"
            name="board"
            placeholder="Enter Board / University">

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Passing Year
        </label>

        <input
            type="number"
            class="form-control"
            name="passingyear"
            placeholder="2026">

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Percentage / CGPA
        </label>

        <input
            type="text"
            class="form-control"
            name="percentage"
            placeholder="Enter Percentage">

    </div>


</div>

<!-- Application Details -->

    <h5 class="section-title"> <i class="bi bi-briefcase"></i> Course Details </h5>

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Courses
        </label>

        <select
            class="form-select"
            name="courses"
            required>

            <option value="">Select Course</option>

            <option>DCA</option>

            <option>DCA-T</option>

            <option>ADCA</option>

            <option>DTP</option>

            <option>TALLY WITH GST</option>

            <option>C Language</option>

            <option>C++</option>

            <option>Python</option>

            <option>Java</option>

            <option>HTML & CSS</option>

            <option>MS Office</option>

            <option>Advanced Excel</option>

            <option>Typing Course</option>

            <option>CCC</option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Batch Timing
        </label>

        <select
            class="form-select"
            name="batch">

            <option value="">Select Batch</option>

            <option>Morning (7 AM - 9 AM)</option>

            <option>Morning (9 AM - 11 AM)</option>

            <option>Afternoon (12 PM - 2 PM)</option>

            <option>Evening (3 PM - 5 PM)</option>

            <option>Evening (5 PM - 7 PM)</option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Learning Mode
        </label>

        <select
            class="form-select"
            name="learningmode">

            <option value="">Select Mode</option>

            <option>Offline</option>

            <option>Online</option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Preferred Contact
        </label>

        <select
            class="form-select"
            name="contact">

            <option>Email</option>

            <option>Phone</option>

            <option>WhatsApp</option>

        </select>

    </div>

</div>


<!-- Address -->

<h5 class="section-title"> <i class="bi bi-house-door"></i> Address </h5>
<div class="row">

<div class="mb-3">
    <textarea
    class="form-control"
    rows="3"
    name="address"
    placeholder="Enter Address"></textarea>

</div>
<div class="col-md-4 mb-3">

        <label class="form-label">
          Pin Code
        </label>

        <input
                type="text"
                class="form-control"
                name="pincode"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="Enter Pin Code">

</div>
<div class="col-md-4 mb-3">

        <label class="form-label">
          District
        </label>

        <input
            type="text"
            class="form-control"
            name="district"
            placeholder="Enter District Name">

</div>

<div class="col-md-4 mb-3">

        <label class="form-label">
           State
        </label>

        <input
            type="text"
            class="form-control"
            name="state"
            placeholder="Enter State">

</div>
</div>

<h5 class="section-title"> <i class="bi bi-house-door"></i> Upload</h5>
<div class="row">
<div class="col-md-4 mb-3">

    <label>Upload Photo</label>

    <input
    type="file"
    class="form-control"
    name="photo"
    id="photo"
    accept="image/*"
    required>

</div>
<div class="col-md-4 mb-3">

    <label>Upload Signature</label>

    <input
    type="file"
    class="form-control"
    name="signature"
    id="signature"
    accept="image/*"
    required>

</div>
</div>
<!-- Submit -->

    <div class="text-center">
        <button type="submit"  class="btn btn-success btn-lg px-5"> Submit Application </button>
    </div>

</form>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
